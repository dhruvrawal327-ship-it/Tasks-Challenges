<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>STUDENT RESULT PANEL</title>
        <style>
            body { font-family: Arial, Helvetica, sans-serif; margin: 40px; max-width: 500px;}
            .form-group { margin-bottom: 15px;}
            input { padding: 8px; margin-right: 5px;}
            button { padding: 8px 15px; cursor: pointer;}
            ul { list-style-type: none; padding: 0; margin-top: 20px;}
            li { padding: 10px; border-bottom: 1px solid #ddd;}
            .pass { color: green; font-weight: bold;}
            .fail { color: red; font-weight: bold;}
        </style>    
    </head>

    <body>

        <h2>🎓STUDENT RESULT PANEL</h2>

        <div class="form-group">
            <input type="text" id="studentName" placeholder="Enter Student Name">
            <input type="number" id="studentMarks" placeholder="Enter Marks">
            <button id="addBtn">Add Student</button>
        </div>

        <ul id="resultList"></ul>

        <script src="script.js"></script>
    </body>
</html>
