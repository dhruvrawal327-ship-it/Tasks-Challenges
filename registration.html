<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <style>
        * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    
    .form-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 580px;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    
    .form-container h2 {
      text-align: center;
      color: #2d3748;
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 600;
    }

    .form-container p {
      text-align: center;
      color: #718096;
      font-size: 14px;
      margin-bottom: 35px;
    }

    
    .form-group {
      display: flex;
      align-items: center;
      margin-bottom: 22px;
      width: 100%;
    }

    
    .form-group > label {
      width: 140px;
      min-width: 140px;
      color: #4a5568;
      font-size: 15px;
      font-weight: 600;
      padding-right: 15px;
    }

    
    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="tel"],
    .form-group select {
      flex: 1;
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 15px;
      color: #2d3748;
      background-color: #f7fafc;
      transition: all 0.25s ease;
      outline: none;
    }

    
    .form-group input:hover,
    .form-group select:hover {
      border-color: #a0aec0;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #3182ce;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
    }

    
    .radio-group {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 24px;
      flex: 1;
    }

    
    .radio-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 15px;
      color: #4a5568;
      /* Negate parent flexbox constraints */
      width: auto !important;
      min-width: auto !important;
      font-weight: 500 !important;
      padding-right: 0 !important;
    }

    .radio-label input[type="radio"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #3182ce;
    }

    
    .submit-btn {
        display: flex;
      width: 100%;
      padding: 13px;
      background-color: #3182ce;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(49, 130, 206, 0.15);
      margin-top: 10px;
      justify-content: center;
    }

    .submit-btn:hover {
      background-color: #2b6cb0;
      transform: translateY(-1px);
      box-shadow: 0 6px 12px rgba(49, 130, 206, 0.25);
    }

    .submit-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 4px rgba(49, 130, 206, 0.15);
    }

    
    @media (max-width: 520px) {
      .form-container {
        padding: 25px 20px;
      }

      .form-container h2 {
        font-size: 24px;
      }

      
      .form-group {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        margin-bottom: 18px;
      }

      .form-group > label {
        width: 100%;
        min-width: 100%;
        padding-bottom: 2px;
      }

      .radio-group {
        width: 100%;
        margin-top: 4px;
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Student Registration</h2>
    <p>Please fill out the form below to register your details.</p>
    
    <form action="#" method="POST">
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Fullname</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your name" required>
      </div>

      <!-- Email Address -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="username@example.com" required>
      </div>

      <!-- Phone Number -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter Phone Number" required>
      </div>

      <!-- Gender Selector -->
      <div class="form-group">
        <label>Gender</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="gender" value="male" required> Male
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="female"> Female
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="other"> Other
          </label>
        </div>
      </div>

      <!-- Course Dropdown selection menu -->
      <div class="form-group">
        <label for="course">Select Course</label>
        <select id="course" name="course" required>
          <option value="" disabled selected>Choose Your Department</option>
          <option value="BCA">Bachelors of Computer Application</option>
          <option value="IT">Information Technology</option>
          <option value="BBA">Bachelors of Business Administration</option>
          <option value="B.com">Bachelors of Commerce</option>
        </select>
      </div>

      <!-- Submit Processing button -->
      <button type="submit" class="submit-btn">Register</button>
    </form>
  </div>
   
</body>
</html>
<!-- Student Registration -->
