<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Employee registration form</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="container">
            <h1>EMPLOYEE REGISTRATION FORM</h1>

            <form id="employeeForm" novalidate>
                <div class="form-group">
                    <label for="empName">Employee Name <span id="charCount" class="char-count">0 / 50</span></label>
                    <input type="text" id="empName" maxlength="50" placeholder="e.g., Rahul Sharma">
                    <small class="error-msg" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="empEmail">Employee Email</label>
                    <input type="email" id="empEmail" placeholder="e.g., Rahul@gmail.com">
                    <small class="error-msg" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="empDept">Department</label>
                    <select id="empDept">
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="empSalary">Employee Salary (₹)</label>
                    <input type="number" id="empSalary" placeholder="e.g., 25000">
                    <small class="error-msg" id="salaryError"></small>
                </div>

                <button type="submit" id="submitBtn">Register Employee</button>

            </form>

            <div class="stats-container">
                <div class="stat-box">
                    <h3>Total Employees</h3>
                    <p id="totalEmployees">0</p>
                </div>

                <div class="stat-box">
                    <h3>Average Salary</h3>
                    <p id="avgSalary">₹0</p>
                </div>

                <div class="stat-box">
                    <h3>Highest Salary</h3>
                    <p id="highestSalary">₹0</p>
                </div>
            </div>

            <h2>Registered Employees</h2>
            <div id="employeeList" id="employee-list">
                <p class="empty-msg">No employees registerd yet.</p>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
